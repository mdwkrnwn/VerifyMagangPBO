# =====================================================================
# Konfigurasi koneksi database VerifyMagang
# ---------------------------------------------------------------------
# File ini dibaca oleh com.mycompany.verifymagang.config.DatabaseConfig.
#
# Nilai di sini bisa ditimpa tanpa mengubah file:
#   - environment variable : DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#   - system property      : -Ddb.host=... -Ddb.password=...
#
# CATATAN PENTING soal port:
#   MariaDB dan MySQL sama-sama memakai port 3306. Jalankan hanya salah satu,
#   atau ubah db.port di bawah sesuai server yang benar-benar aktif.
#
# Contoh nilai umum:
#   Laragon / XAMPP (MySQL)  -> db.user=root   db.password=
#   MariaDB (instalasi biasa)-> db.user=root   db.password=root
# =====================================================================

db.host=localhost
db.port=3306
db.name=verify_magang
db.user=root
db.password=root

# Parameter tambahan untuk JDBC (boleh dikosongkan)
db.params=useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta&characterEncoding=UTF-8
